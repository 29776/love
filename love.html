<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>爱情短板测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lovePink: '#FFD6E0',
            loveRose: '#FF7AA0',
            loveBerry: '#D94F70',
            loveBg: '#FFF5F8',
            loveCard: '#FFFFFF',
            loveText: '#4A2233',
            loveSub: '#9B6779'
          },
          fontFamily: {
            sans: ['PingFang SC', 'Microsoft YaHei', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: linear-gradient(180deg, #FFE4EE 0%, #FFF5F8 40%, #FFFFFF 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px rgba(217, 79, 112, 0.12);
    }
    .option-card {
      background: #fff;
      border: 1px solid #FFE4EE;
      transition: all .25s ease;
    }
    .option-card:hover {
      background: #FFF0F6;
      border-color: #FF7AA0;
      transform: translateY(-2px);
    }
    .result-card {
      background: linear-gradient(140deg, #FFE4EE, #FFFBFC);
      border: 1px solid #FFD6E0;
      box-shadow: 0 20px 40px rgba(217, 79, 112, 0.15);
    }
    .progress-dot {
      transition: all .3s ease;
    }
    .title-font {
      font-weight: 800;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body class="font-sans text-loveText">

<div class="max-w-md mx-auto px-5 pt-10 pb-10">

  <!-- 顶部标题 -->
  <div class="text-center mb-6">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/80 text-loveRose text-xs font-semibold shadow-sm">
      <i class="fa fa-heart"></i> 恋爱情绪自测
    </div>
    <h1 class="title-font text-3xl mt-3 text-loveBerry">爱情短板测试</h1>
    <p class="text-loveSub text-sm mt-2">15题看见你的亲密关系模式</p>
  </div>

  <!-- 免责声明 -->
  <div class="glass-card rounded-2xl px-4 py-3 mb-5 text-xs text-loveSub leading-relaxed">
    ⚠️ 娱乐趣味自测，仅供参考，不属于专业心理测评，不能替代心理咨询师诊断。
  </div>

  <!-- 答题区 -->
  <div id="loveQuestionBox" class="glass-card rounded-3xl p-6">
    <div class="flex justify-between items-center mb-4">
      <span class="text-xs text-loveSub">进度</span>
      <span id="loveProgress" class="text-sm font-bold text-loveRose">1 / 15</span>
    </div>

    <div class="w-full h-2 bg-pink-100 rounded-full overflow-hidden mb-5">
      <div id="loveProgressBar" class="h-full bg-gradient-to-r from-lovePink to-loveRose rounded-full transition-all duration-400" style="width: 6.66%"></div>
    </div>

    <h2 id="loveQuestionTitle" class="text-lg font-bold leading-relaxed mb-5"></h2>

    <div id="loveOptions"></div>
  </div>

  <!-- 结果区 -->
  <div id="loveResultBox" class="hidden">
    <div class="result-card rounded-3xl p-6 mb-5">
      <div class="text-center mb-4">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white shadow-sm mb-3">
          <i class="fa fa-heart-o text-2xl text-loveRose"></i>
        </div>
        <h3 id="loveResultTitle" class="title-font text-xl text-loveBerry"></h3>
      </div>

      <p id="loveResultDesc" class="text-sm leading-relaxed text-loveText/80 mb-4"></p>

      <div class="space-y-3">
        <div class="bg-white/80 rounded-2xl p-4">
          <div class="text-xs text-loveRose font-bold mb-1">你的恋爱优势</div>
          <p id="loveAdvantage" class="text-sm"></p>
        </div>
        <div class="bg-white/80 rounded-2xl p-4">
          <div class="text-xs text-loveRose font-bold mb-1">改善小建议</div>
          <p id="loveTip" class="text-sm"></p>
        </div>
      </div>

      <div class="mt-5 border-t border-pink-200 pt-4 text-center">
        <p id="loveSlogan" class="title-font text-loveRose italic"></p>
      </div>
    </div>

    <button onclick="restartLove()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-loveRose to-loveBerry text-white font-bold shadow-lg shadow-pink-300/40 active:scale-95 transition">
      重新测试
    </button>
  </div>

</div>

<script>
const loveQuestions = [
  {q:"伴侣长时间不回消息，你第一反应？",o:["胡思乱想，反复看聊天框，脑补最坏结果","有点失落，但先忙自己的事，等对方解释","心里不舒服，但不会主动追问，默默憋着","直接质问，表达不满，希望对方立刻回应"]},
  {q:"吵架之后，你通常？",o:["疯狂复盘对错，反复回想对方伤人的话，很久走不出来","冷静一段时间，愿意好好沟通，解决问题","习惯性沉默冷战，等对方主动低头","情绪上头，脱口而出狠话，事后容易后悔"]},
  {q:"当对方和你的想法不一样时，你会？",o:["下意识妥协，优先照顾对方感受，压抑自己需求","客观表达想法，双方协商，求同存异","不想争辩，直接回避话题，减少冲突","一定要说服对方，希望对方认同你的观点"]},
  {q:"恋爱中你更容易？",o:["把爱情当成生活重心，容易失去自我","爱情是生活加分项，保留自己圈子爱好","害怕投入太多受伤，不敢完全敞开内心","希望对方完全包容你，满足你的情绪需求"]},
  {q:"伴侣夸奖你的时候，你的感受？",o:["不敢相信，觉得对方只是客套，内心不自信","坦然接受夸奖，大方表达感谢","淡淡带过，不习惯接收亲密正向表达","习惯持续要对方不断肯定，缺夸奖就不安"]},
  {q:"发现伴侣有小缺点，你会？",o:["自动美化对方，选择性忽略问题，自我洗脑","接受人不完美，分清小缺点和原则问题","一旦发现缺点，慢慢降低期待，悄悄拉开距离","总想改造对方，希望对方按你的标准改变"]},
  {q:"一段关系里，你最害怕？",o:["被抛弃、对方慢慢不爱我","两个人三观不合，无法沟通","失去个人自由，被关系束缚","自己付出很多得不到对等回报"]},
  {q:"如果对方很忙忽略了你，你会？",o:["不断主动找对方，希望获取关注","理解对方，安排自己生活，有空再见面","直接减少主动联系，情绪藏心里慢慢抽离","觉得对方不在乎自己，爆发负面情绪"]},
  {q:"面对分手风险，你第一反应？",o:["拼命挽回，甚至降低底线讨好","冷静沟通，评估这段关系是否值得继续","提前抽离，先假装无所谓保护自己","争吵对峙，指责对方的问题"]},
  {q:"你会不会经常拿别人的恋爱对比自己？",o:["经常对比，总羡慕别人的爱情","很少，每段感情都有自己的样子","会默默对比，降低对亲密关系期待","经常对比，觉得自己付出更多"]},
  {q:"对方提出不同意见反驳你，你？",o:["马上怀疑是不是自己做错了","认真听对方想法，理性讨论","不想争论，直接回避不再聊这个话题","觉得对方不理解你，感到生气委屈"]},
  {q:"在感情里，你表达需求的方式？",o:["不敢直接说，等着对方主动猜到","直接温和说出自己需求，好好沟通","尽量不提需求，怕给对方添麻烦","用生气、冷暗示的方式，让对方猜"]},
  {q:"当感情平淡没有新鲜感，你会？",o:["焦虑不安，怀疑是不是不爱了","接受平淡，一起创造新的小美好","觉得平淡是正常，慢慢减少情感投入","希望对方持续制造惊喜，维持热烈"]},
  {q:"你会不会因为恋爱，牺牲自己的计划？",o:["经常，优先迁就对方时间","双方互相协调，不会单方面牺牲","很少牺牲，优先守住自己的边界","我可以牺牲，但对方也要同等付出"]},
  {q:"如果伴侣没有满足你的期待，你内心？",o:["自我内耗，反复怀疑是不是自己要求太多","客观沟通，调整期待，接受对方能力有限","默默记心里，慢慢减少对TA的期待","感到失望，直接表达不满"]}
];

const loveResult = {
  A:{
    title:"过度敏感，容易在爱里丢失自我",
    desc:"你在感情里很看重安全感，容易把对方的一举一动过度解读。对方回消息慢、语气平淡，都会在你心里上演小剧场。你习惯优先照顾对方感受，常常委屈自己，害怕被抛弃，容易陷入单方面内耗。",
    adv:"共情力很强，非常懂得珍惜爱人，愿意真心付出。",
    tip:"把注意力放回自己身上，不要把情绪开关交给别人。学会直接表达需求，不要靠猜测去判断爱意。",
    slogan:"你最大的爱情难题，是总在害怕失去，而忘了自己本身就值得被爱。"
  },
  B:{
    title:"对亲密关系有理想化期待",
    desc:"你理智通透，懂得沟通，但内心对爱情有一套理想化标准。一旦现实恋爱和想象不一样，容易产生落差感。你习惯理性评判对错，有时会忽略感情本身没有绝对的是非。",
    adv:"情绪稳定，懂得尊重边界，具备好好沟通的能力。",
    tip:"爱情不是剧本，接纳伴侣的不完美，少用标准衡量爱意，感受真实相处，而不是想象里的恋爱。",
    slogan:"你不是遇不到好的人，是容易拿理想剧本，要求现实里的爱情。"
  },
  C:{
    title:"习惯自我保护，不敢深度交付真心",
    desc:"一旦感受到压力，你的本能就是后退、沉默、拉开距离。你害怕投入之后受伤，所以提前关闭情绪，习惯独自消化委屈。伴侣会觉得你忽冷忽热，很难走进你的内心。",
    adv:"独立清醒，不会过度依附对方，拥有稳定自我。",
    tip:"试着允许自己依赖别人，不用独自硬扛所有负面情绪。告诉对方你的感受，不用一有压力就逃跑。",
    slogan:"你习惯性筑起高墙，一边渴望被爱，一边推开靠近你的人。"
  },
  D:{
    title:"情绪来得快，习惯向外索取情绪价值",
    desc:"你爱恨分明，期待被重视，一旦感受不到被在乎，容易爆发情绪。你希望伴侣读懂你的情绪、主动哄你，容易忽略对方的压力。争吵时容易脱口伤人，事后又后悔。",
    adv:"爱恨坦荡，不擅长伪装，爱就会全身心投入。",
    tip:"情绪上头先暂停表达，不要在生气时做决定。爱意不是靠对方不断妥协证明，双向包容才能长久。",
    slogan:"你渴望被坚定偏爱，但别用尖锐的情绪，推开想爱你的人。"
  }
};

let loveIndex = 0;
let loveScore = {A:0,B:0,C:0,D:0};

function renderLove(){
  const p = loveQuestions[loveIndex];
  document.getElementById("loveProgress").innerText = `${loveIndex + 1} / 15`;
  document.getElementById("loveProgressBar").style.width = ((loveIndex + 1) / 15 * 100) + "%";
  document.getElementById("loveQuestionTitle").innerText = p.q;

  const labels = ["A","B","C","D"];
  document.getElementById("loveOptions").innerHTML = p.o.map((opt,i)=>`
    <div class="option-card rounded-2xl p-4 mb-3 cursor-pointer" onclick="selectLove('${labels[i]}')">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-pink-50 text-loveRose flex items-center justify-center font-bold text-sm">${labels[i]}</div>
        <div class="text-sm flex-1">${opt}</div>
      </div>
    </div>
  `).join("");
}

function selectLove(t){
  loveScore[t]++;
  loveIndex++;
  if(loveIndex >= loveQuestions.length){
    showLoveResult();
  }else{
    renderLove();
  }
}

function showLoveResult(){
  document.getElementById("loveQuestionBox").classList.add("hidden");
  document.getElementById("loveResultBox").classList.remove("hidden");

  let maxKey = Object.keys(loveScore).reduce((a,b)=>loveScore[a]>loveScore[b]?a:b);
  const r = loveResult[maxKey];

  document.getElementById("loveResultTitle").innerText = "✨ " + r.title;
  document.getElementById("loveResultDesc").innerText = r.desc;
  document.getElementById("loveAdvantage").innerText = r.adv;
  document.getElementById("loveTip").innerText = r.tip;
  document.getElementById("loveSlogan").innerText = r.slogan;
}

function restartLove(){
  loveIndex = 0;
  loveScore = {A:0,B:0,C:0,D:0};
  document.getElementById("loveQuestionBox").classList.remove("hidden");
  document.getElementById("loveResultBox").classList.add("hidden");
  renderLove();
}

renderLove();
</script>

</body>
</html>
